# CI of this repository: workflow-check, also on the merge queue.
name: test

on:
  pull_request:
    types: [opened, synchronize, reopened, edited] # edited: the title check
  push:
    branches: [main, "release/v*"]
  merge_group:
  workflow_dispatch: # dispatched checks of release pull requests (FY-0030)

permissions: {}

concurrency:
  group: test-${{ github.ref }}
  # A title or description edit must not cancel a long run; merge_group runs
  # have refs of their own and are never cancelled.
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
        && github.event.action != 'edited' }}

jobs:
  check:
    # Dispatched runs post their final status on every outcome.
    if: ${{ !cancelled() || github.event_name == 'workflow_dispatch' }}
    # Probe branch that accepts merge_group.
    uses: flakeyard/workflow-check/.github/workflows/check.yaml@probe/merge-group
    permissions:
      actions: read # own job name and the jobs of the run
      contents: read # repository files through the contents API, checkout
      pull-requests: read # the title of the pull request
      statuses: write # commit statuses of dispatched runs
    with:
      needs: ${{ toJSON(needs) }}
      flake: .
      expect-checks: '["probe"]'
      renovate-config: false
